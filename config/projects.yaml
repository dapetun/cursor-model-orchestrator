# Project type detection — path prefixes + filesystem markers
# Precedence: prompt tags > path_prefixes > markers > mixed

version: 1

tags:
  "@ds": ds
  "@paper": paper
  "@web": web

path_prefixes:
  # Data science / ML / econometrics repos
  - path: "C:\\My_Data\\Files\\Hobby\\GitHub\\ВКР"
    type: ds
  - path: "C:/My_Data/Files/Hobby/GitHub/ВКР"
    type: ds
  - path: "C:\\My_Data\\Files\\Hobby\\Magister Preparation"
    type: paper
  - path: "C:/My_Data/Files/Hobby/Magister Preparation"
    type: paper
  # This orchestrator repo
  - path: "C:\\My_Data\\Files\\Hobby\\GitHub\\cursor-model-orchestrator"
    type: cursor_meta
  - path: "C:/My_Data/Files/Hobby/GitHub/cursor-model-orchestrator"
    type: cursor_meta

# Substring match on workspace root (case-insensitive on Windows)
path_contains:
  - pattern: "ВКР"
    type: ds
  - pattern: "Magister"
    type: paper
  - pattern: "статья"
    type: paper
  - pattern: "cursor-model-orchestrator"
    type: cursor_meta
  - pattern: ".cursor\\skills"
    type: cursor_meta
  - pattern: ".cursor/skills"
    type: cursor_meta

markers:
  ds:
    any_files:
      - "*.ipynb"
    any_paths:
      - "notebooks"
      - "data"
      - "ml"
    requirements_packages:
      - pandas
      - sklearn
      - scikit-learn
      - torch
      - statsmodels
      - econometrics
    files:
      - pyproject.toml
  paper:
    any_files:
      - "*.tex"
    any_paths:
      - "article"
      - "paper"
      - "thesis"
    # Prefer paper when md-heavy without app layout (heuristic in skill)
    md_heavy_without_app: true
  web:
    files:
      - package.json
    any_files:
      - "src/**/*.tsx"
      - "src/**/*.jsx"
      - "app/**/*.tsx"
    any_paths:
      - "components"
  backend:
    files:
      - "Dockerfile"
    any_paths:
      - "api"
      - "services"
    requirements_packages:
      - fastapi
      - flask
      - django
  cursor_meta:
    files:
      - "SKILL.md"
      - "mcp.json"
    any_paths:
      - ".cursor"
      - "skill"

# When markers conflict, prefer this order
marker_priority:
  - cursor_meta
  - paper
  - ds
  - web
  - backend

default_type: mixed
