name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    name: Signed-off-by check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Signed-off-by on PR commits
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          commits=$(git rev-list --no-merges "${BASE}..${HEAD}")
          if [[ -z "${commits}" ]]; then
            echo "No non-merge commits to check."
            exit 0
          fi
          failed=0
          while IFS= read -r c; do
            [[ -z "$c" ]] && continue
            if ! git log -1 --format=%B "$c" | grep -qE '^Signed-off-by: .+ <.+>$'; then
              echo "::error::Missing Signed-off-by on commit $c"
              git log -1 --format=fuller "$c"
              failed=1
            else
              echo "OK $c"
            fi
          done <<< "$commits"
          if [[ "$failed" -ne 0 ]]; then
            echo "Add a DCO trailer with: git commit --amend -s   or   git rebase --signoff ${BASE}"
            exit 1
          fi
